<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1F2D">
<meta name="description" content="Swim meet and practice timer for coaches.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deckside">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;background:#EAF0F3}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Deckside Meet Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#EAF0F3; --surface:#FFFFFF; --surface2:#E0E8ED; --ink:#0D1F2D; --muted:#566775; --line:#C9D5DC;
  --accent:#0A66B0; --accent-ink:#FFFFFF; --accent-soft:#D6E7F5;
  --swim:#D23B2C; --swim-ink:#FFFFFF; --blocks:#E5A800; --blocks-ink:#2E2200; --deck:#0A66B0; --deck-ink:#FFFFFF;
  --good:#12815A; --good-soft:#D5F0E4; --bad:#C23A2B; --bad-soft:#F8DEDA;
  --rope-a:#D23B2C; --rope-b:#FFFFFF; --rope-c:#0A66B0;
  --drop-on-ink:#43D18F; --gain-on-ink:#FF7A68;
  --shadow:0 1px 2px rgba(13,31,45,.07),0 6px 18px rgba(13,31,45,.06);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#07121A; --surface:#0E1F2B; --surface2:#15303F; --ink:#E3ECF1; --muted:#8FA4B3; --line:#223A4B;
    --accent:#4DA6EC; --accent-ink:#04121C; --accent-soft:#12324A;
    --swim:#FF6B58; --swim-ink:#1A0400; --blocks:#F4C430; --blocks-ink:#231900; --deck:#4DA6EC; --deck-ink:#04121C;
    --good:#3CC487; --good-soft:#0F3527; --bad:#FF6B58; --bad-soft:#3A1510;
    --rope-a:#FF6B58; --rope-b:#DCE6EB; --rope-c:#4DA6EC;
    --drop-on-ink:#0F7A52; --gain-on-ink:#B8321F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#07121A; --surface:#0E1F2B; --surface2:#15303F; --ink:#E3ECF1; --muted:#8FA4B3; --line:#223A4B;
  --accent:#4DA6EC; --accent-ink:#04121C; --accent-soft:#12324A;
  --swim:#FF6B58; --swim-ink:#1A0400; --blocks:#F4C430; --blocks-ink:#231900; --deck:#4DA6EC; --deck-ink:#04121C;
  --good:#3CC487; --good-soft:#0F3527; --bad:#FF6B58; --bad-soft:#3A1510;
  --rope-a:#FF6B58; --rope-b:#DCE6EB; --rope-c:#4DA6EC;
  --drop-on-ink:#0F7A52; --gain-on-ink:#B8321F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--ground);overscroll-behavior:none}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.t{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:760px;margin:0 auto}
@media (min-width:900px){ .top-in{max-width:none;padding:6px 28px;gap:14px} .top .fsbtn{width:34px;height:34px;border-radius:9px} .top .fsbtn svg{width:18px;height:18px} .brand{font-size:20px} }
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.meetname{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rope{height:1px;background:var(--line)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"] .dot{background:var(--good)}
.sync[data-s="syncing"] .dot{background:var(--blocks)}
.sync[data-s="offline"] .dot{background:var(--blocks)}
.sync[data-s="nosave"] .dot{background:var(--bad)}

main.wide{max-width:none;padding-block:10px calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px))}
.fsbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.fsbtn svg{width:20px;height:20px}
.setbtn{display:none}
body.nosetup .setbtn{display:inline-flex;margin-left:6px}
body.nosetup .nav [data-v=setup]{display:none}
body.nosetup .nav-in{grid-template-columns:repeat(4,1fr)}
body.kiosk .setbtn{display:none!important}
html:fullscreen main{padding-block:20px}
.disp{font-size:var(--fs,16px);display:flex;flex-direction:column;gap:.9em;overflow:hidden}
.disp .chip{font-size:.8em}
.disp .btn.sm{font-size:max(13px,.8em);min-height:34px}
.disp>*{flex-shrink:0}
.disp-head{display:flex;justify-content:space-between;align-items:center;gap:.8em;flex-wrap:wrap}
.disp>.disp-head{font-size:14px;gap:10px}
.disp>.disp-head>.row{margin-left:auto;justify-content:flex-end;gap:8px}
.disp>.disp-head .segs button{font-size:14px;min-height:36px;padding:0 12px}
.disp>.disp-head .chip{font-size:11px}
.disp>.disp-head .btn.sm{font-size:13px;min-height:34px}
.disp>.disp-head .eyebrow{font-size:11px}
/* display empty states: same card as the record board, small heading + one muted line, fixed size */
.disp:has(>.dempty){gap:16px}
.disp .dempty{font-size:16px;padding:14px 18px 16px;text-align:center}
.disp .dempty h2{font-family:var(--display);font-size:17px;text-transform:uppercase;padding:0;margin:0 0 4px}
.disp .dempty p{margin:0;font-size:14px;color:var(--muted)}
.disp .eyebrow{font-size:max(10px,.7em)}
.disp-title{font-family:var(--display);font-weight:700;font-size:2.4em;text-transform:uppercase;line-height:1}
.disp-body{display:grid;grid-template-columns:minmax(0,1fr);gap:1em;align-items:start}
.disp-body.split{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.latest{background:var(--ink);color:var(--surface);border-radius:.9em;padding:.9em 1.1em;display:flex;flex-direction:column;gap:.3em}
.latest .eyebrow{color:inherit;opacity:.7}
.latest .disp-title{font-size:2em}
.lt-row{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto 5.6em;gap:.7em;align-items:baseline;padding:.12em 0;border-top:1px solid rgba(143,164,179,.3)}
.lt-pl{font-family:var(--display);font-weight:600;font-size:1.4em;opacity:.6}
.lt-nm{font-family:var(--display);font-weight:700;font-size:1.85em;text-transform:uppercase;line-height:1.05;min-width:0;white-space:nowrap}
.disp.nmwrap .lt-nm{white-space:normal;overflow-wrap:anywhere}
.lt-t{position:relative;font-family:var(--display);font-weight:700;font-size:2.25em;font-variant-numeric:tabular-nums;line-height:1;min-width:3.7em;text-align:right;padding-right:.45em}
.lt-t .recstar{position:absolute;right:0;top:-.15em;margin:0;font-size:.8em}
.qcut{display:inline-block;vertical-align:.3em;margin-left:.4em;padding:.05em .4em;border-radius:.35em;font-family:var(--display);font-weight:800;font-size:.55em;line-height:1.25;letter-spacing:.02em;background:var(--good-soft);color:var(--good);text-transform:none;white-space:nowrap}
.bcut{display:block;line-height:1;margin-top:.15em}
.bcut .qcut{margin-left:0;vertical-align:0}
.fullboard .bcut .qcut{font-size:1.3em}
.board td .qcut{font-size:.8em;vertical-align:.15em;background:var(--good);color:#fff}
.disp .board td .qcut{font-size:1em}
.latest .qcut{background:var(--good);color:#fff}
.qcut.new,.latest .qcut.new,.board td .qcut.new{background:var(--blocks);color:var(--blocks-ink)}
.lt-d{font-size:.85em;font-weight:600;text-align:right;opacity:.75;white-space:nowrap;overflow:hidden}
.lt-d.good,.lt-d.drop{color:var(--drop-on-ink);opacity:1}
.lt-d.gain{color:var(--gain-on-ink);opacity:1}
.drop{color:var(--good)!important;font-weight:700}
.gain{color:var(--bad)!important;font-weight:700}
.chip.drop{background:var(--good-soft)}
.chip.gain{background:var(--bad-soft)}
.board .bd.drop,.board .bd.gain{font-weight:700;font-size:.9em}
.latest .lt-d.drop,.latest .lt-d.gain{font-size:1.15em}
.lt-clock{font-family:var(--display);font-weight:700;font-size:3.6em;line-height:1;font-variant-numeric:tabular-nums}
.bsplit{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.disp .dboard{overflow:hidden}
.disp .dboard{background:var(--surface);border-radius:.9em;box-shadow:var(--shadow);padding:.3em .4em}
.disp .dboard h2{font-family:var(--display);font-size:1.3em;text-transform:uppercase;padding:.3em .5em 0}
.disp .board th{font-size:.75em;padding:.4em .6em}
.disp .board td{padding:.3em .6em;vertical-align:middle;font-size:1em}
.disp .board td b{font-size:1.35em}
.disp .board .bt{font-size:1.9em;line-height:1.05}
.disp .board .bd{font-size:.75em}
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--nav-h) + 72px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:18px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:0 auto;height:var(--nav-h)}
.nav button{min-width:0;font-size:11px!important;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button[aria-current="true"]{color:var(--accent)}
.nav svg{width:24px;height:24px}

/* common */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--swim-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.swim{background:var(--swim);color:var(--swim-ink)}
.chip.blocks{background:var(--blocks);color:var(--blocks-ink)}
.chip.deck{background:var(--deck);color:var(--deck-ink)}
.chip.later{background:var(--surface2);color:var(--muted)}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.pr{background:var(--good);color:var(--surface)}
.chip.dq{background:var(--bad);color:var(--surface)}
.chip.cut{background:var(--good-soft);color:var(--good)}
.chip.miss{background:var(--surface2);color:var(--muted)}
.chip.demo{background:var(--blocks);color:var(--blocks-ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px;font-size:16px;color:var(--ink);font-weight:400;width:100%}
textarea{resize:vertical;min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px!important}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.banner{border-radius:12px;padding:12px 14px;background:var(--blocks);color:var(--blocks-ink);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner .btn{background:transparent;border-color:currentColor;color:inherit;min-height:36px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{font-family:var(--display);font-size:24px;color:var(--ink);text-transform:uppercase;margin-bottom:6px}
.code{font-family:var(--display);font-weight:600;letter-spacing:.02em}

/* pool clock card */
.now{background:var(--ink);color:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.now .eyebrow{color:inherit;opacity:.7}
.now-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.now-code{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em}
.now-sub{font-size:14px;opacity:.8}
.now-ctrl{display:grid;grid-template-columns:52px 1fr auto;gap:8px}
.now-ctrl .btn{background:transparent;color:inherit;border-color:rgba(127,160,180,.45)}
.now-ctrl .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* up next cards */
.upnext{display:flex;flex-direction:column;gap:10px}
.up{display:grid;grid-template-columns:8px 1fr auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:0;text-align:left;padding:0;width:100%}
.up .band{background:var(--surface2)}
.up[data-st="swim"] .band{background:var(--swim)}
.up[data-st="blocks"] .band{background:var(--blocks)}
.up[data-st="deck"] .band{background:var(--deck)}
.up-body{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.up-name{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.up-meta{font-size:13px;color:var(--muted)}
.up-side{padding:12px 14px;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px}
.up-time{font-family:var(--display);font-weight:600;font-size:20px}

/* swim list */
.list{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ev-h{padding:9px 14px 7px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;display:flex;justify-content:space-between;gap:10px}
.srow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:11px 14px;min-height:58px}
.ev-h + .srow{border-top:0}
.srow.past{opacity:.62}
.srow .clock{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1}
.srow .clock small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted)}
.srow .who{min-width:0}
.srow .who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .who span{font-size:12.5px;color:var(--muted)}
.srow .res{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.srow .res .t{font-family:var(--display);font-weight:600;font-size:18px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--ground);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-h h3{flex:1;min-width:0;font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:44px;height:44px;border-radius:10px;border:0;background:var(--surface2);font-size:22px;line-height:1}
.sheet-b{flex:1;overflow:auto;overscroll-behavior:contain;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* timer */
.tm-clock{font-family:var(--display);font-weight:700;font-size:min(22vw,112px);line-height:.95;text-align:center;letter-spacing:.01em}
.tm-head{text-align:center;display:flex;flex-direction:column;gap:4px}
.startbtn{touch-action:manipulation;width:100%;min-height:120px;border-radius:18px;border:0;background:var(--good);color:var(--surface);font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.06em;text-transform:uppercase}
.lane{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.lane-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lane-top b{font-family:var(--display);font-size:24px;text-transform:uppercase;line-height:1.05}
.lane-top .t{font-family:var(--display);font-weight:600;font-size:28px}
.splitbtn{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;letter-spacing:.04em;min-height:96px}
.splitbtn.fin{background:var(--swim);color:var(--swim-ink)}
.solo .splitbtn{min-height:170px;font-size:44px}
.lanes{display:flex;flex-direction:column;gap:12px}
.lanes.multi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.multi .lane{padding:10px;gap:8px}
.multi .lane-top{flex-direction:column;gap:2px}
.multi .lane-top b{font-size:19px}
.multi .lane-top .t{font-size:24px}
.multi .splitbtn{min-height:88px;font-size:24px}
.multi .lane-ctl{flex-wrap:wrap}
.pick{display:flex;flex-wrap:wrap;gap:8px;max-height:46vh;overflow:auto;padding:2px}
.pick .tag{min-height:40px}
.picked{display:flex;flex-wrap:wrap;gap:6px}
.grpsegs{width:100%}
.gpill{display:inline-block;min-width:1.5em;text-align:center;border-radius:5px;background:var(--surface2);color:var(--ink);font-weight:700;padding:0 4px;margin-right:4px}
.grpsegs button{flex:1;padding:0 6px;font-size:13px;white-space:nowrap}
.grpsegs .n{font-weight:500;opacity:.65;margin-left:2px}
.cklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 10px;max-height:60vh;overflow:auto;padding:2px}
.ck{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:9px 8px;border-radius:10px;min-height:48px}
.ck:hover{background:var(--surface2)}
.ck .box{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.ck[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.ck[aria-checked="true"] .box::after{content:"";width:6px;height:12px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.ck .nm{flex:1;min-width:0;font-weight:600}
.ck .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.lanes.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

function mergeMeet(a,b){

  if((a.rev||0)!==(b.rev||0)) return clone((a.rev||0)>(b.rev||0)?a:b);   // heat sheet re-loaded: newest load wins
  const newer=(a.updatedAt||0)>=(b.updatedAt||0)?a:b, O=newer===a?b:a; const M=clone(newer);
  const gone={...(O.gone||{})}; for(const k in (M.gone||{})) gone[k]=Math.max(gone[k]||0,M.gone[k]); if(Object.keys(gone).length) M.gone=gone;
  M.events=M.events||[]; M.heats=M.heats||[]; M.entries=M.entries||[]; M.swims=M.swims||{}; M.timers=M.timers||{};
  if(M.plan&&O.plan&&M.plan.at===O.plan.at){ const e=Math.max(M.plan.ended||0,O.plan.ended||0), r=Math.max(M.plan.resumed||0,O.plan.resumed||0); if(e>r) M.plan.ended=e; else delete M.plan.ended; if(r) M.plan.resumed=r; }
  const sig=ev=>[ev.dist,ev.stroke,ev.course,ev.relay?1:0,M.practice?'':ev.num,M.practice?'':ev.title].join('|');
  const map={};
  for(const ev of O.events||[]){ let t=M.events.find(x=>sig(x)===sig(ev));
    if(!t){ t={...clone(ev),idx:M.events.length}; if(M.practice) t.num=String(M.events.length+1); M.events.push(t); }
    map[ev.idx]=t.idx; }
  for(const hh of O.heats||[]){ if(M.heats.some(x=>x.k===hh.k)||gone['h:'+hh.k]) continue; if(map[hh.ev]==null) continue; M.heats.push({...clone(hh),ev:map[hh.ev]}); }
  const hk=new Set(M.heats.map(x=>x.k));
  for(const e of O.entries||[]){ if(M.entries.some(x=>x.id===e.id)||gone['e:'+e.id]||!hk.has(e.hk)||map[e.ev]==null) continue; M.entries.push({...clone(e),ev:map[e.ev]}); }
  if(Object.keys(gone).length) M.entries=M.entries.filter(e=>!gone['e:'+e.id]);
  for(const k in (O.timers||{})){ const OT=O.timers[k], MT=M.timers[k], g=gone['t:'+k]||0; if(!hk.has(k)) continue;
    if(!MT){ if((OT.t0||0)>g) M.timers[k]=clone(OT); continue; }
    if(MT.t0===OT.t0){ MT.fin={...(OT.fin||{}),...(MT.fin||{})}; MT.laps=MT.laps||{}; for(const id in (OT.laps||{})) if(!MT.laps[id]||OT.laps[id].length>MT.laps[id].length) MT.laps[id]=clone(OT.laps[id]); if(OT.done&&!MT.done){ MT.done=true; MT.doneAt=OT.doneAt; } }
    else if((OT.t0||0)>(MT.t0||0)) M.timers[k]=clone(OT); }
  for(const k in M.timers) if((gone['t:'+k]||0)>=(M.timers[k].t0||0)&&gone['t:'+k]) delete M.timers[k];
  for(const id in (O.swims||{})){ const OS=O.swims[id], MS=M.swims[id];
    if(!MS){ M.swims[id]=clone(OS); continue; }
    if(OS.time!=null&&(MS.time==null||(OS.at||0)>(MS.at||0))){ Object.assign(MS,{time:OS.time,splits:clone(OS.splits),splitDist:OS.splitDist,at:OS.at}); if(OS.dq!=null) MS.dq=OS.dq; if(OS.official!=null) MS.official=OS.official; }
    if((!MS.tags||!MS.tags.length)&&OS.tags&&OS.tags.length) MS.tags=clone(OS.tags); if(!MS.note&&OS.note) MS.note=OS.note; if(!MS.rec&&OS.rec&&MS.time===OS.time) MS.rec=OS.rec; }
  for(const id in M.swims){ const g=gone['s:'+id]; const sw=M.swims[id]; if(g&&sw.time!=null&&(sw.at||0)<=g){ delete sw.time; delete sw.splits; } }
  if(O.plan&&(!M.plan||(O.plan.at||0)>(M.plan.at||0))) M.plan=clone(O.plan);
  // latest edit of each field wins
  const ea=newer.ed||{}, eo=O.ed||{}; const oWins=k=>(eo[k]||0)>(ea[k]||0);
  for(const k of new Set([...Object.keys(newer),...Object.keys(O)])){ if(MEET_STRUCT.includes(k)||!oWins('k:'+k)) continue; if(O[k]===undefined) delete M[k]; else M[k]=clone(O[k]); }
  for(const id in (O.swims||{})){ const OS=O.swims[id], MS=M.swims[id]; if(!OS||!MS) continue; for(const f of SW_FIELDS) if(oWins('s:'+id+':'+f)){ if(OS[f]===undefined) delete MS[f]; else MS[f]=clone(OS[f]); } }
  for(const id in (newer.swims||{})){ const NS=newer.swims[id], MS=M.swims[id]; if(!NS||!MS) continue; for(const f of SW_FIELDS){ const k='s:'+id+':'+f; if((ea[k]||0)>(eo[k]||0)){ if(NS[f]===undefined) delete MS[f]; else MS[f]=clone(NS[f]); } } }
  for(const e of M.entries){ if(!oWins('e:'+e.id)) continue; const src=(O.entries||[]).find(x=>x.id===e.id); if(src&&map[src.ev]!=null&&hk.has(src.hk)) Object.assign(e,clone(src),{ev:map[src.ev]}); }
  M.heats.forEach((hh,i)=>{ if(!oWins('h:'+hh.k)) return; const src=(O.heats||[]).find(x=>x.k===hh.k); if(src&&map[src.ev]!=null) M.heats[i]={...clone(src),ev:map[src.ev]}; });
  const ed={...ea}; for(const k in eo) ed[k]=Math.max(ed[k]||0,eo[k]); if(Object.keys(ed).length) M.ed=ed;
  M.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return M;
}
function watchMeet(){
  if(!sync.db) return;
  const id=S.demo?null:S.active; if(subs.meetId===id&&subs.meet) return;
  if(subs.meet){ subs.meet(); subs.meet=null; }
  subs.meetId=id; if(!id) return;
  subs.meet=ref('meet_'+id).onSnapshot(snap=>{
    if(!snap.exists||snap.metadata.hasPendingWrites||sync.dirty.has('meet_'+id)) return;
    const d=snap.data(), lm=S.meets[id];
    if(!lm){ setMeet(id,clone(d)); writeLocal(); liveRender(); return; }
    const mg=mergeMeet(lm,d); const ms=meetSig(mg);
    if(ms!==meetSig(lm)){ setMeet(id,mg); writeLocal(); liveRender(); }
    if(ms!==meetSig(d)){ sync.dirty.add('meet_'+id); scheduleFlush(); }   // this device had something the other didn't
  },()=>{ subs.meet=null; subs.meetId=null; });
}
async function adoptCore(rc){

  for(const mi of rc.meetIndex||[]){ if(S.deleted.includes(mi.id)) continue; const lm=S.meets[mi.id];
    if(!lm||(lm.updatedAt||0)<mi.updatedAt){ try{ const ms=await withTimeout(ref('meet_'+mi.id).get()); if(ms.exists){ const d=ms.data(); setMeet(mi.id,mergeMeet(lm,d)); if(lm&&meetSig(S.meets[mi.id])!==meetSig(d)) sync.dirty.add('meet_'+mi.id); } }catch(e){} } }
  for(const id of S.deleted) delete S.meets[id];
  S.meetOrder=[...new Set([...(rc.meetOrder||[]).filter(id=>S.meets[id]),...Object.keys(S.meets)])];
  const following=(UI.sheet&&UI.sheet.type==='board')||UI.tab==='display';
  if((following||!S.meets[S.active])&&S.meets[rc.active]) S.active=rc.active;

function scheduleFlush(){ if(!sync.db||S.demo) return; clearTimeout(sync.timer); sync.timer=setTimeout(flush,350); }
async function flush(){
  if(!sync.db||S.demo||sync.busy) return;
  if(!sync.dirty.size){ setSync('synced'); return; }
  sync.busy=true; setSync('syncing');
  let failed=false;
  for(const key of [...sync.dirty]){
    sync.dirty.delete(key);
    try{
      if(key==='core'){ let done=false;
        for(let i=0;i<6&&!done;i++){ const rs=await withTimeout(ref('core').get()); let exp=null;
          if(rs.exists){ const rd=rs.data()||{}; exp=rd.rev||null; const r=takeCore(rd); if(r.changed){ writeLocal(); liveRender(); } }
          const cd=coreDoc(); cd.rev=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
          try{ done=await withTimeout(ref('core').casSet(cd,exp,rs.exists)); }catch(e){ if(e&&e.message==='timeout') throw e; await withTimeout(ref('core').set(cd)); done=true; }
          if(done) setCoreBase(cd); }
        if(!done) throw new Error('core busy'); }
      else if(key.startsWith('del_')) await withTimeout(ref('meet_'+key.slice(4)).delete());
      else { const id=key.slice(5); if(S.meets[id]){ try{ const r=await withTimeout(ref(key).get()); if(r.exists){ const mg=mergeMeet(S.meets[id],r.data()); if(meetSig(mg)!==meetSig(S.meets[id])){ setMeet(id,mg); writeLocal(); liveRender(); } } }catch(e){} await withTimeout(ref(key).set(clone(S.meets[id]))); } }
    }catch(e){ sync.dirty.add(key); failed=true; break; }
  }
  sync.busy=false;
  setSync(failed?'offline':'synced');
  if(!failed&&sync.dirty.size) scheduleFlush();
}

/* Find every meet saved to the account, straight from the table. The meet list inside the core doc
   can be overwritten by another device that hasn't seen a new meet yet, so it isn't trusted for discovery. */
async function discoverMeets(quiet){
  if(!sync.db||S.demo||sync.discovering) return 0; sync.discovering=true; let added=[];
  try{
    const {data,error}=await withTimeout(supa.from(TBL).select('key,updated_at').eq('user_id',sync.uid).like('key',KP+'meet_%'));
    if(error) throw error;
    for(const row of data||[]){ if(!row.key.startsWith(KP+'meet_')) continue; const id=row.key.slice((KP+'meet_').length); if(!id||(S.deleted||[]).includes(id)) continue;
      const lm=S.meets[id]; const rt=Date.parse(row.updated_at||'')||0;
      if(lm&&rt<=(lm.updatedAt||0)+2000) continue;
      try{ const ms=await withTimeout(ref('meet_'+id).get()); if(!ms.exists) continue; const d=ms.data(); if(!d||!d.id&&!d.events) continue;
        if(!d.id) d.id=id; const mg=mergeMeet(lm,d); if(!lm||meetSig(mg)!==meetSig(lm)){ setMeet(id,mg); if(!lm) added.push(id); }
        if(lm&&meetSig(mg)!==meetSig(d)) sync.dirty.add('meet_'+id); }catch(e){} }
    if(added.length){ S.meetOrder=[...new Set([...added.sort((a,b)=>(S.meets[b].updatedAt||0)-(S.meets[a].updatedAt||0)),...S.meetOrder])].filter(id=>S.meets[id]); }
    sync.lastDiscover=Date.now();
  }catch(e){}
  sync.discovering=false;
  if(added.length){ writeLocal(); liveRender(); const real=added.map(id=>S.meets[id]).filter(m=>m&&!m.practice);
    if(!quiet) toast(real.length?(real[0].name||'Meet')+' synced to this device':added.length+' meet day'+(added.length===1?'':'s')+' synced'); if(sync.dirty.size) scheduleFlush(); }
  return added.length;
}

async function pull(){
  setSync('syncing');
  try{
    const snap=await withTimeout(ref('core').get());
    if(S.demo){ // remote data wins over demo if it exists
      if(snap.exists){ S=blank(); } else { setSync('synced'); return; }
    }
    if(snap.exists){
      const rc=snap.data();
      const hadActive=S.active; const r=takeCore(rc); restoreDraft(!hadActive);
      if(!S.meets[S.active]) S.active=rc.active;
      if(r.ahead) sync.dirty.add('core');
      const idx=rc.meetIndex||[];
      for(const mi of idx){
        if(S.deleted.includes(mi.id)) continue;
        const lm=S.meets[mi.id];
        if(!lm||(lm.updatedAt||0)<mi.updatedAt){ const ms=await withTimeout(ref('meet_'+mi.id).get()); if(ms.exists){ const d=ms.data(); setMeet(mi.id,mergeMeet(lm,d)); if(lm&&meetSig(S.meets[mi.id])!==meetSig(d)) sync.dirty.add('meet_'+mi.id); } }
        else if((lm.updatedAt||0)>mi.updatedAt) sync.dirty.add('meet_'+mi.id);
      }
      for(const id in S.meets) if(!idx.some(x=>x.id===id)){ sync.dirty.add('meet_'+id); sync.dirty.add('core'); }
      for(const id of S.deleted) delete S.meets[id];
    } else if(S.roster.length||Object.keys(S.meets).length){
      sync.dirty.add('core'); for(const id in S.meets) sync.dirty.add('meet_'+id);
    }
    S.meetOrder=[...new Set([...S.meetOrder.filter(id=>S.meets[id]),...Object.keys(S.meets)])];
    if(S.active&&!S.meets[S.active]) S.active=S.meetOrder[0]||null;
    writeLocal(); render(); if(UI.sheet) renderSheet();
    setSync('synced'); flush(); subscribeLive(); discoverMeets().then(()=>cleanupBFree());
  }catch(e){ setSync('offline'); }
}

/* ---------- derived data ---------- */
function heatIndex(m){ const o={}; m.heats.forEach((h,i)=>o[h.k]=i); return o; }
function entryTime(sw){ if(!sw||sw.dq) return null; return sw.official!=null?sw.official:(sw.time!=null?sw.time:null); }
function entryCourse(m,ev){ return ev.course||m.course||'SCY'; }
function status(m,idx,est,e){
  const sw=m.swims&&m.swims[e.id];
  if(sw&&(sw.time!=null||sw.official!=null||sw.dq)) return {st:'done',label:sw.dq?'DQ':'Done'};
  const i=idx[e.hk]; if(i==null) return {st:'later',label:'—'};
  if(m.now&&idx[m.now.k]!=null){
    const d=i-idx[m.now.k];
    if(d<0) return {st:'past',label:'Swum'};
    if(d===0) return {st:'swim',label:'In the water'};
    if(d<=2) return {st:'blocks',label:'Behind blocks'};
    if(d<=6) return {st:'deck',label:'On deck'};
    return {st:'later',label:d+' heats away'};
  }
  const mins=(est[i]-Date.now())/60000;
  if(mins<=-3) return {st:'later',label:'Est. '+clock(est[i])};
  if(mins<=5) return {st:'blocks',label:'Behind blocks'};
  if(mins<=14) return {st:'deck',label:'On deck'};
  return {st:'later',label:'In '+Math.round(mins)+' min'};
}
function myAge(m,e){ if(e.age) return e.age; const s=swimmer(e.swimmers[0]); return s&&s.age?s.age:null; }
function myGender(m,e){ const ev=m.events[e.ev]; if(ev.gender==='F'||ev.gender==='M') return ev.gender; const s=swimmer(e.swimmers[0]); return s?s.gender:''; }
let _usa10=null; function builtin10u(){ return _usa10||(_usa10=USA_10U.split('\n').map(parseStdLine).filter(Boolean)); }
function standardsFor(gender,age,ev,course){
  let pool=S.standards||[]; if(!pool.some(s=>s.ageLabel==='10&U'&&s.course==='SCY')) pool=pool.concat(builtin10u());
  return pool.filter(s=>s.dist===ev.dist&&s.stroke===ev.stroke&&s.course===course&&(!s.gender||!gender||s.gender===gender)&&(age==null||(age>=s.ageMin&&age<=s.ageMax))).sort((a,b)=>b.time-a.time);

function cutsFor(time,stds){
  if(time==null) return {hit:[],next:stds[0]||null,all:stds};
  const hit=stds.filter(s=>time<=s.time+1e-9); const miss=stds.filter(s=>time>s.time+1e-9);

/* test sets (and practices marked as a test) never count toward best times, seeding or records */
function testKeys(m){ const o={}; for(const hh of m.heats) if(m.test||hh.test) o[hh.k]=1; return o; }

/* all individual results for a swimmer across meets */

function history(swId){
  const out=[];

    for(const e of m.entries){ if(e.relay||!e.swimmers.includes(swId)||tk[e.hk]) continue; const sw=m.swims&&m.swims[e.id]; if(!sw) continue;
      const ev=m.events[e.ev]; out.push({m,e,ev,sw,time:entryTime(sw),course:entryCourse(m,ev),key:eventKey(ev),at:sw.at||dateAt(m.date,'12:00'),practice:!!m.practice}); }

function fitDisplay(){

  }catch(err){ title='Something went wrong'; body=`<p>${esc(err.message)}</p>`; }
  const scroll=el.querySelector('.sheet-b')?.scrollTop||0;
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h3>${esc(title)}</h3><button class="x" data-act="close" aria-label="Close">×</button></div><div class="sheet-b"><div class="sheet-in">${body}</div></div></div>`;

}

function sheetTimer(m,hk){
  const idx=heatIndex(m), i=idx[hk], hh=m.heats[i], ev=m.events[hh.ev];
  const ents=m.entries.filter(e=>e.hk===hk).sort((a,b)=>(a.lane||0)-(b.lane||0)||(a.slot||0)-(b.slot||0));

  h+=`<div class="tm-clock t" data-clock="main">${T&&T.t0?fmt(((T.doneAt||Date.now())-T.t0)/1000):'0.00'}</div>`;

  if(quick){ h+=quickPad(m,ents,T,laps,pairs);
    if(T&&T.done){ const rs=ents.map(e=>({e,t:entryTime(m.swims&&m.swims[e.id])})).sort((a,b)=>(a.t??1e9)-(b.t??1e9));
      h+=`<div class="list">${rs.map((r,i)=>`<button class="srow" data-act="entry" data-v="${esc(r.e.id)}"><span class="clock">${i+1}<small>L${r.e.lane}${r.e.offset?' · 2nd':''}</small></span><span class="who"><b>${esc(r.e.relay?'Relay':swName(r.e.swimmers[0]))}</b><span>Tap for notes</span></span><span class="res"><span class="t">${fmt(r.t)}</span>${isRecordSwim(m,r.e)?'<span class="recchip">RECORD</span>':pendingFor(m,r.e)?'<span class="recchip" style="opacity:.75">RECORD?</span>':''}${r.t!=null&&!r.e.relay?cutChip(r.e.swimmers[0],m.events[r.e.ev],entryCourse(m,m.events[r.e.ev]),r.t):''}${(pb=>pb&&r.t!=null?`<span class="small ${dClass(r.t-pb.time)}">${fmtDiff(r.t-pb.time)}</span>`:'')(m.practice?priorBest(r.e.swimmers[0],ev,entryCourse(m,ev),r.e.id,(m.swims[r.e.id]||{}).at,true):null)}</span></button>`).join('')}</div>`; }
    h+=timerFooter(m,hh,hk,T); return ['Timer',h]; }
  h+=`<div class="lanes ${pairs?'pairs':ents.length>=3?'multi':''} ${ents.length>=6?'dense':''}">`;
  const cells=[];
  if(pairs){ const lanes=[...new Set(ents.map(e=>e.lane))].sort((a,b)=>a-b); for(const l of lanes){ cells.push(ents.find(e=>e.lane===l&&!e.slot)||null); cells.push(ents.find(e=>e.lane===l&&e.slot)||null); } }
  else cells.push(...ents);

    const lapTxt=arr.map((ms,j)=>`<span>${(j+1)*splitDist}: <b>${fmt(ms/1000)}</b>${j>0?' ('+fmt((ms-arr[j-1])/1000)+')':''}</span>`).join('');

        <div class="dmeta"><span>L${e.lane}${pairs?(off?' · 2nd':' · 1st'):''}${lastS&&!fin?' · '+lastS:''}</span>${T&&T.t0&&n?`<button class="btn sm ghost" data-act="tm-undo" data-v="${esc(e.id)}">Undo</button>`:''}</div>
        ${T&&T.t0&&!fin&&!T.done?`<button class="splitbtn ${isLast?'fin':''}" data-act="tm-split" data-v="${esc(e.id)}">${isLast?'Finish':'Split '+(n+1)+'/'+laps}</button>`:''}
        ${fin?`<button class="btn sm" data-act="entry" data-v="${esc(e.id)}">Notes</button>`:''}</div>`;
      continue;
    }
    h+=`<div class="lane ${solo?'solo':''}"><div class="lane-top"><div><b>${esc(nm)}</b><div class="small muted">${e.lane!=null?'Lane '+e.lane:'Lane ?'}${pairs?(off?' · 2nd, +'+off+'s':' · 1st'):''} · ${m.practice?(()=>{const pb=priorBest(e.swimmers[0],ev,entryCourse(m,ev),e.id,sw&&sw.at||Date.now(),true);return 'best '+(pb?fmt(pb.time):'—');})():'seed '+esc(e.seed!=null?fmt(e.seed):'NT')}${e.relay&&e.swimmers.length?' · '+e.swimmers.map(shortName).map(esc).join(', '):''}</div></div>
      <span class="t" ${fin?'':`data-clock="${esc(e.id)}" data-off="${off}"`}>${fin?fmt(arr[arr.length-1]/1000):(T&&T.t0?clockText((Date.now()-T.t0)/1000-off):'—')}</span></div>`;
    if(T&&T.t0&&!fin&&!T.done) h+=`<button class="splitbtn ${isLast?'fin':''}" data-act="tm-split" data-v="${esc(e.id)}">${isLast?'Finish':'Split '+(n+1)+'/'+laps}</button>`;
    if(lapTxt) h+=`<div class="laps">${lapTxt}</div>`;
    if(T&&T.t0) h+=`<div class="lane-ctl">${fin?`<button class="btn sm primary" data-act="entry" data-v="${esc(e.id)}">Notes &amp; cuts</button>`:(T.done?'<span class="small muted">No time</span>':`<button class="btn sm" data-act="tm-finish" data-v="${esc(e.id)}">Finish now</button>`)}<button class="btn sm ghost" data-act="tm-undo" data-v="${esc(e.id)}" ${n?'':'disabled'}>Undo split</button></div>`;
    if(fin&&sw&&!e.relay&&isRecordSwim(m,e)) h+=`<div class="row"><span class="recchip">NEW RECORD ✓</span></div>`;
    else if(fin&&sw&&!e.relay&&pendingFor(m,e)) h+=`<div class="row"><span class="recchip">POSSIBLE RECORD</span><button class="btn sm primary" data-act="rec-yes" data-v="${esc(m.id+'|'+e.id)}">Confirm</button><button class="btn sm" data-act="rec-no" data-v="${esc(m.id+'|'+e.id)}">Not a record</button></div>`;
    if(fin&&sw&&m.practice){ const pb=priorBest(e.swimmers[0],ev,entryCourse(m,ev),e.id,sw.at,true); const cc=cutChip(e.swimmers[0],ev,entryCourse(m,ev),entryTime(sw)); if(pb||cc) h+=`<div class="row">${pb?`<span class="chip ${dClass(entryTime(sw)-pb.time)||'later'}">${fmtDiff(entryTime(sw)-pb.time)} vs best</span>`:''}${cc}</div>`; }
    else if(fin&&sw){ const pr=!e.relay&&isPR(m,e,sw); const ev2=m.events[e.ev]; const st=e.relay?[]:standardsFor(myGender(m,e),myAge(m,e),ev2,entryCourse(m,ev2)); const c=cutsFor(entryTime(sw),st);
      h+=`<div class="row">${pr?'<span class="chip pr">PR</span>':''}${e.seed!=null?`<span class="chip ${dClass(entryTime(sw)-e.seed)||'later'}">${fmtDiff(entryTime(sw)-e.seed)} vs seed</span>`:''}${c.hit.slice(-1).map(x=>`<span class="chip cut">${esc(x.name)} cut</span>`).join('')}${c.next?`<span class="chip miss">${fmt(entryTime(sw)-c.next.time)} to ${esc(c.next.name)}</span>`:''}</div>`; }
    h+='</div>';

  h+=timerFooter(m,hh,hk,T);
  return ['Timer',h];
}
function timerFooter(m,hh,hk,T){
  let h='';
  if(T&&T.done){ const pr=pendingRecords().filter(x=>x.m.id===m.id&&x.e.hk===hk); h+=recConfirmHTML(pr); }
  if(m.practice&&m.plan&&hh.planHeat){ const nk=nextPlanHeat(m,hk);
    // never get stuck: end a heat that's still running, or skip one that hasn't started
    if(T&&T.t0&&!T.done) h+=`<button class="btn ${UI.armed==='tm-endall'?'armed danger':''}" data-act="tm-endall" data-v="${esc(hk)}" style="min-height:52px;font-weight:700">${UI.armed==='tm-endall'?'Tap again: stop the clock and end this heat':'Stop all · end heat'}</button>`;
    if((!T||!T.t0)&&nk) h+=`<button class="btn ghost" data-act="plan-next" data-v="${esc(hk)}">Skip to ${esc(heatLabel(m,nk))} ›</button>`;
    if(nk||(T&&T.t0&&!T.done)) h+=finishEarlyBtn();
    if(T&&T.done) h+=nk?`<button class="btn primary" data-act="plan-next" data-v="${esc(hk)}" style="min-height:64px;font-size:18px">Next: ${esc(heatLabel(m,nk))} ›</button>`:'<div class="banner"><span><b>Last heat done.</b> Nice work.</span></div>'; if(T&&T.done&&nk) h+=boardCtl(m); if(T&&T.done&&nk) h+=`<button class="btn ghost" data-act="lu-edit-heat" data-v="${esc(nk)}">Add or remove swimmers for the next heats</button>`; }
  else if(m.practice&&T&&T.done) h+=`<button class="btn primary" data-act="q-next" style="min-height:56px">Same swimmers, next set</button>`;
  if(T&&T.t0) h+=`<div class="row" style="justify-content:space-between"><button class="btn danger ${UI.armed==='tm-reset'?'armed':''}" data-act="tm-reset" data-v="${esc(hk)}">${UI.armed==='tm-reset'?'Tap again to reset':'Reset timer'}</button>${T.done?'<button class="btn primary" data-act="close">Done</button>':''}</div>`;
  return h;
}
/* Quick stop: every stop button packed into one grid laid out like the pool (lanes across, 2nd swimmers underneath) */
function quickPad(m,ents,T,laps,pairs){
  const lanes=[...new Set(ents.map(e=>e.lane??0))].sort((a,b)=>a-b);
  const rows=pairs?2:1;
  const cols=pairs||lanes.length<=5?lanes.length:Math.min(4,Math.ceil(ents.length/2));
  const grid=[];
  if(pairs||lanes.length===ents.length&&lanes.length<=5){ for(let r=0;r<rows;r++) for(const l of lanes) grid.push(ents.find(e=>(e.lane??0)===l&&(pairs?(r?e.slot:!e.slot):true))||null); }
  else grid.push(...ents);
  for(const e of ents) if(!grid.includes(e)) grid.push(e);
  const last=T&&T.log&&T.log.length?T.log[T.log.length-1]:null;
  let h=`<div class="qpad ${grid.length<=5?'qpad-tall':''}" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">`;
  if(pairs||cols===lanes.length) h+=lanes.slice(0,cols).map(l=>`<div class="qh">L${l}</div>`).join('');
  for(const e of grid){
    if(!e){ h+='<div class="qb none"></div>'; continue; }
    const arr=T&&T.laps[e.id]||[]; const fin=T&&T.fin[e.id]; const n=arr.length; const isLast=n===laps-1; const off=e.offset||0;
    const nm=e.relay?'Relay':shortName(e.swimmers[0]);
    let cls='', a='', t='';
    if(!T||!T.t0){ cls='wait'; a='—'; }
    else if(fin){ cls='done'; a=fmt(arr[arr.length-1]/1000); t='✓'; }
    else if(T.done){ cls='wait'; a='No time'; }
    else { cls='fin'; a='Stop'; t=''; }
    const waiting=T&&T.t0&&!T.done&&!fin&&off&&(Date.now()-T.t0)/1000<off;
    h+=`<button class="qb ${cls} ${last===e.id?'flash':''}" ${T&&T.t0&&!fin&&!T.done?`data-fast="tm-split" data-act="tm-split" data-finish="1" data-v="${esc(e.id)}"`:fin?'aria-disabled="true"':'disabled'}>
      <span class="qn">${esc(nm)}</span><span class="qa" ${waiting?`data-wait="${off}" data-next="${esc(a)}"`:''}>${waiting?'Go in '+Math.ceil(off-(Date.now()-T.t0)/1000):esc(a)}</span><span class="qt">${esc(t)}</span></button>`;
  }
  h+='</div>';
  if(T&&T.t0&&!T.done) h+=`<p class="hint" style="margin:0;text-align:center">One tap stops that lane. No splits in quick stop.</p>`;
  return h;
}

function sheetEntry(m,eid){

      h+=`<div class="cmp"><div><div class="eyebrow">Previous practice best</div><div class="v t">${pb?fmt(pb.time):'—'}</div><div class="small ${pb&&t!=null?dClass(t-pb.time):''}">${pb&&t!=null?fmtDiff(t-pb.time):'First practice swim of this'}</div></div>

    }

  // notes

/* ---------- timer engine ---------- */
let rafOn=false, wake=null;
function startTick(){ if(rafOn) return; rafOn=true; requestAnimationFrame(tick); }
function tick(){
  const s=UI.sheet; const m=M();
  if(!s||s.type!=='timer'||!m){ rafOn=false; return; }
  const T=m.timers&&m.timers[s.v];
  if(T&&T.t0&&!T.done){ const now=Date.now(); document.querySelectorAll('[data-clock]').forEach(el=>{ el.textContent=clockText((now-T.t0)/1000-(+(el.dataset.off||0))); });
    document.querySelectorAll('[data-wait]').forEach(el=>{ const left=(+el.dataset.wait)-(now-T.t0)/1000; if(left>0) el.textContent='Go in '+Math.ceil(left); else { el.textContent=el.dataset.next||''; el.removeAttribute('data-wait'); } }); }
  requestAnimationFrame(tick);
}
async function keepAwake(on){ try{ if(on&&!wake&&navigator.wakeLock){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;}); } if(!on&&wake){ await wake.release(); wake=null; } }catch(e){} }
function clockText(t){ return t<0?'Go in '+Math.ceil(-t):fmt(t); }
function buzz(){ try{ navigator.vibrate&&navigator.vibrate(25); }catch(e){} }
function finalize(m,T,eid){
  const arr=T.laps[eid]; if(!arr||!arr.length) return;
  m.swims=m.swims||{}; const prev=m.swims[eid]||{tags:[],note:''};
  m.swims[eid]=Object.assign({},prev,{time:round2(arr[arr.length-1]/1000),splits:arr.map(x=>round2(x/1000)),splitDist:T.splitDist,at:T.t0}); delete m.swims[eid].rec;
  T.fin[eid]=true;
  try{ const e0=m.entries.find(x=>x.id===eid); const r=e0&&pendingFor(m,e0); if(r){ setTimeout(()=>toast('Possible record! '+swName(e0.swimmers[0])+' · '+recEvName(r.ev)+' · '+fmt(r.t)+'. Confirm it below.'),50); try{ navigator.vibrate&&navigator.vibrate([60,60,60,60,120]); }catch(x){} } }catch(x){}
  const ents=m.entries.filter(e=>e.hk===T.hk);
  if(ents.every(e=>T.fin[e.id])){ T.done=true; T.doneAt=Date.now(); keepAwake(false); }
}

let lastFastTap=0;
function doSplit(m,v,finishNow,now){
  const e=m.entries.find(x=>x.id===v); if(!e) return; const T=m.timers&&m.timers[e.hk]; if(!T||!T.t0||T.fin[v]) return;
  const ms=now-T.t0-(e.offset||0)*1000; if(ms<=0){ toast('They haven\'t left yet'); return; }
  (T.laps[v]=T.laps[v]||[]).push(ms); (T.log=T.log||[]).push(v); buzz();
  const ev0=m.events[e.ev]; const laps=Math.max(1,Math.round(ev0.dist/T.splitDist));
  if(finishNow||T.laps[v].length>=laps) finalize(m,T,v);
  renderSheet(); save(m.id);
}

  if(T.fin[v]){ delete T.fin[v]; T.done=false; delete T.doneAt; const sw=m.swims[v]; if(sw){ delete sw.time; delete sw.splits; } }

function findSwimmer(name){
  const n=String(name||'').trim(); if(!n) return null;
  const hits=whoIn(n,buildMatchers(S.roster)); if(hits.length===1) return hits[0];
  if(hits.length>1){ const exact=hits.find(s=>norm(n).includes(norm(s.last))&&norm(n).includes(norm(s.first))); return exact||null; }
  // "Last First" with no comma
  const parts=norm(n).split(' '); if(parts.length>=2){ const r=S.roster.filter(s=>norm(s.last)===parts[0]&&norm(s.first).startsWith(parts[1])); if(r.length===1) return r[0]; }
  return null;
}

function importTimes(rawIn,quiet){

  const split=l=>l.includes('\t')?l.split('\t').map(x=>x.trim()):l.split(',').map(x=>x.trim());
  let set=0, bad=[], miss=new Set();
  const put=(sw,ev,tx)=>{ const t=parseTime(String(tx).replace(/[^0-9:.]/g,'')); if(t==null||t<5){ return false; } sw.times=sw.times||{}; sw.times[TKEY(ev.dist,ev.stroke,ev.course)]=t; set++; return true; };

function confetti(host,ms){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); host.appendChild(c); const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=c.width=innerWidth*dpr, H=c.height=innerHeight*dpr; const x=c.getContext('2d');
  const cols=['#E5A800','#D23B2C','#0A66B0','#12815A','#FFFFFF','#4DA6EC','#FF6B58'];
  const P=[]; const burst=(ox)=>{ for(let i=0;i<110;i++){ const a=-Math.PI/2+(Math.random()-.5)*1.3, v=(9+Math.random()*13)*dpr; P.push({x:ox,y:H,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:(5+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],sh:i%3}); } };
  burst(W*.15); burst(W*.85); setTimeout(()=>burst(W*.5),450);
  const t0=performance.now(); const g=.32*dpr;
  (function f(t){ x.clearRect(0,0,W,H); const fade=Math.max(0,1-(t-t0-ms+900)/900);
    for(const p of P){ p.vy+=g; p.vx*=.992; p.vy*=.992; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.globalAlpha=fade; x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c;
      if(p.sh===0) x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else if(p.sh===1){ x.beginPath(); x.arc(0,0,p.s/2.6,0,7); x.fill(); } else { x.fillRect(-p.s/6,-p.s/2,p.s/3,p.s); } x.restore(); }
    if(t-t0<ms&&c.isConnected) requestAnimationFrame(f); else c.remove(); })(t0);
}

/* ---------- PDF reading (pdf.js, loaded on demand) ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function loadPdfJs(){
  if(window.pdfjsLib) return;
  const base='vendor/';
  await loadScript(base+'pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
}
function joinItems(items){ let s='',end=null; for(const i0 of items){ const i={...i0,s:i0.s.replace(/\u03D0/g,'f').replace(/\uFB02/g,'fl').replace(/\uFB01/g,'fi').replace(/\uFB00/g,'ff')}; if(end!=null&&(i.x-end>1.2||(i.x-end>-4&&/^[MWFB]?\d{1,2}$/.test(i.s.trim())))) s+=' '; s+=i.s; end=i.x+i.w; } return s.replace(/\s+/g,' ').replace(/Butter\s*f+\s*l+\s*y/gi,'Butterfly').trim(); }
/* Hy-Tek prints 1, 2 or 3 columns per page. Find where each column starts from the "Heat", "Lane" and "#8 Event" labels. */
function pdfColumns(items){
  const xs=items.filter(i=>/^(Heat|Lane|Event)$/i.test(i.s.trim())||/^(#\d+|Event\s+\d+)\b/i.test(i.s.trim())).map(i=>i.x).sort((a,b)=>a-b);
  const groups=[]; for(const x of xs){ const g=groups[groups.length-1]; if(g&&x-g.max<=14){ g.max=x; g.n++; } else groups.push({min:x,max:x,n:1}); }
  const cols=groups.filter(g=>g.n>=2).map(g=>g.min);
  return cols.length>=2?cols:null;
}
function rowsOf(items){
  items=[...items].sort((a,b)=>b.y-a.y||a.x-b.x); const rows=[];
  for(const it of items){ let r=null; for(let j=rows.length-1;j>=Math.max(0,rows.length-4);j--){ if(Math.abs(rows[j].y-it.y)<=Math.max(2,it.h*0.4)){ r=rows[j]; break; } } if(!r){ r={y:it.y,items:[]}; rows.push(r); } r.items.push(it); }
  return rows.map(r=>joinItems(r.items.sort((a,b)=>a.x-b.x))).filter(Boolean);
}
async function pdfToLines(file){
  await loadPdfJs();
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    UI.draft.busy=file.name+' · page '+p+' of '+pdf.numPages; if(p%5===1) renderSheet();
    const page=await pdf.getPage(p); const vp=page.getViewport({scale:1}); const tc=await page.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({x:i.transform[4],y:i.transform[5],w:i.width||0,h:Math.abs(i.transform[3])||8,s:i.str}));
    const cols=pdfColumns(items);
    if(cols){ // read each column top to bottom, left column first
      const top=Math.max(...items.filter(i=>/^(Heat|Lane)$/i.test(i.s.trim())||/^#\d+/.test(i.s.trim())).map(i=>i.y))+14;
      const head=items.filter(i=>i.y>top), body=items.filter(i=>i.y<=top);
      rowsOf(head).forEach(l=>out.push(l));
      cols.forEach((c,ci)=>{ const next=cols[ci+1]; rowsOf(body.filter(i=>i.x>=c-6&&(next==null||i.x<next-6))).forEach(l=>out.push(l)); });
      continue;
    }
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    const rows=[];
    for(const it of items){ let r=null; for(let j=rows.length-1;j>=Math.max(0,rows.length-4);j--){ if(Math.abs(rows[j].y-it.y)<=Math.max(2,it.h*0.4)){ r=rows[j]; break; } } if(!r){ r={y:it.y,items:[]}; rows.push(r); } r.items.push(it); }
    const mid=vp.width/2;
    const looks=s=>/^(Event\s*\d|#\s*\d+\s|Heat\s+\d)/i.test(s)||/^\d{1,2}\s+[A-Z][A-Za-z'\-]+(\s[A-Za-z'\-]+)?,/.test(s)||/^[1-4]\)\s/.test(s);
    let lc=0,rc=0,span=0;
    const segs=rows.map(r=>{ r.items.sort((a,b)=>a.x-b.x); const L=r.items.filter(i=>i.x<mid-4), R=r.items.filter(i=>i.x>=mid-4);
      if(L.some(i=>i.x+i.w>mid+8)) span++; const lt=joinItems(L), rt=joinItems(R); if(looks(lt)) lc++; if(looks(rt)) rc++; return {lt,rt,all:joinItems(r.items)}; });
    const two=lc>=2&&rc>=2&&span<=Math.max(3,rows.length*0.15);
    if(two){ segs.forEach(s=>s.lt&&out.push(s.lt)); segs.forEach(s=>s.rt&&out.push(s.rt)); }
    else segs.forEach(s=>out.push(s.all));
  }
  return out;
}

  const R=[['Harper','William','','M',12],['Nguyen','Dan','','M',11],['Lee','Ava','','F',12],['Brooks','Mia','','F',11],['Patel','Sofia','','F',12],['Carter','Leonardo','Leo','M',12]];
  st.roster=R.map(([last,first,nick,gender,age])=>({id:'d'+first.toLowerCase(),first,last,nick,gender,age}));
  const others=['Ramos, Ella','Kim, Noah','Okafor, Jade','Silva, Lucas','Berg, Nora','Ito, Kai','Walsh, Ruby','Diaz, Mateo','Fox, Ivy','Hale, Owen','Park, June','Stone, Eli','Reyes, Luna','Ward, Finn','Cole, Maya','Nash, Theo','Bell, Zoe','Hart, Max','Lane, Isla','Moss, Jack'];
  const teams=['KCAC-PN','BAC-PN','SSC-PN','MIAC-PN'];
  let seedN=7; const rnd=()=>{ seedN=(seedN*9301+49297)%233280; return seedN/233280; };
  const L=['Wave Aquatics Fall Invite - 9/26/2026','Meet Program','Event 1 Girls 11-12 100 Yard Freestyle'];
  const evs=[
    ['1','Girls 11-12 100 Yard Freestyle',68,{F:['Lee, Ava','Brooks, Mia','Patel, Sofia']}],
    ['2','Boys 11-12 100 Yard Freestyle',66,{M:['Harper, William','Nguyen, Dan','Carter, Leonardo']}],
    ['3','Girls 11-12 50 Yard Backstroke',36,{F:['Brooks, Mia']}],
    ['4','Boys 11-12 50 Yard Backstroke',35,{M:['Nguyen, Dan','Carter, Leonardo']}],
    ['5','Girls 11-12 100 Yard Breaststroke',86,{F:['Lee, Ava','Patel, Sofia']}],
    ['6','Boys 11-12 100 Yard Breaststroke',84,{M:['Harper, William']}],
    ['7','Girls 11-12 200 Yard IM',165,{F:['Lee, Ava','Brooks, Mia']}],
    ['8','Boys 11-12 200 Yard IM',160,{M:['Harper, William','Carter, Leonardo']}],
  ];
  const lines=['Wave Aquatics Fall Invite - 9/26/2026','HY-TEK\'s MEET MANAGER'];
  const my={'Lee, Ava':12,'Brooks, Mia':11,'Patel, Sofia':12,'Harper, William':12,'Nguyen, Dan':11,'Carter, Leonardo':12};
  let oi=0;
  for(const [num,title,base,mine] of evs){
    lines.push('Event '+num+' '+title); lines.push('Lane Name Age Team Seed Time');
    const pool=[]; const mineList=Object.values(mine)[0];
    for(let i=0;i<16;i++){ const nm=i<mineList.length?mineList[i]:others[(oi++)%others.length]; const mine1=i<mineList.length; pool.push({nm,age:mine1?my[nm]:11+Math.floor(rnd()*2),team:mine1?'WAVE-PN':teams[Math.floor(rnd()*4)],seed:base*(0.9+rnd()*0.35)}); }
    pool.sort((a,b)=>b.seed-a.seed);
    if(num==='7'){ const a=pool.findIndex(p=>p.nm==='Lee, Ava'), b=pool.findIndex(p=>p.nm==='Brooks, Mia'); const t=a%6===5?a-1:a+1; if(Math.floor(b/6)!==Math.floor(a/6)){ const tmp=pool[t]; pool[t]=pool[b]; pool[b]=tmp; } pool[t===b?b:t].seed=pool[a].seed+(t>a?-0.4:0.4); }
    const H=Math.ceil(pool.length/6);
    for(let hN=1;hN<=H;hN++){ lines.push('Heat '+hN+' of '+H+' Timed Finals'); pool.slice((hN-1)*6,hN*6).forEach((p,j)=>lines.push((j+1)+' '+p.nm+' '+p.age+' '+p.team+' '+fmt(p.seed))); }
  }
  lines.push('Event 9 Mixed 11-12 200 Yard Medley Relay','Lane Team Relay Seed Time','Heat 1 of 1 Timed Finals','2 King County Aquatics-PN A 2:31.80','1) Kim, Noah 12 2) Berg, Nora 11 3) Ito, Kai 12 4) Fox, Ivy 12','3 Wave Aquatics-PN A 2:28.45','1) Lee, Ava 12 2) Harper, William 12 3) Brooks, Mia 11 4) Nguyen, Dan 11','4 Bellevue Aquatic-PN A 2:34.10','1) Silva, Lucas 11 2) Walsh, Ruby 12 3) Hale, Owen 12 4) Park, June 11');
  const r=parseSheet(lines,st.roster,{team:'WAVE',lanes:6});
  const id='demo';
  const now=Date.now();
  const m={id,name:'Wave Fall Invite (demo)',date:todayISO(),course:'SCY',startTime:'9:00',turnover:30,team:'WAVE',lanes:6,events:r.events,heats:r.heats,entries:r.entries,swims:{},timers:{},now:null,updatedAt:now};
  // put the meet partway through: first swim of E2 is in the water, earlier swims done
  const idx=heatIndex(m); const cur=m.heats.findIndex(h=>h.ev===1);
  m.now={k:m.heats[cur].k,at:now-40000};
  let before=0; for(let i=0;i<cur;i++) before+=heatDur(m,m.heats[i])*1000;
  const d0=new Date(now-40000-before); m.startTime=String(d0.getHours()).padStart(2,'0')+':'+String(d0.getMinutes()).padStart(2,'0');
  const first=m.entries.filter(e=>idx[e.hk]<cur);
  const tagsets=[['Great start','Faded'],['Short breakout','Strong finish'],['Bad turn']];
  first.forEach((e,j)=>{ const t=round2(e.seed-0.9+j*0.7); const half=round2(t*0.47); m.swims[e.id]={time:t,splits:[round2(half*0.48),half,round2(half+(t-half)*0.5),t],splitDist:25,at:now-600000+j*60000,tags:tagsets[j%3],note:j===0?'Held the stroke count on the back half. Talk about the turn off the wall.':''}; });
  st.meets[id]=m; st.meetOrder=[id]; st.active=id;
  const cut=(name,g,ev,t)=>({id:uid(),name,gender:g,ageMin:11,ageMax:12,ageLabel:'11-12',...(()=>{const i=parseEventTitle(ev);return {dist:i.dist,stroke:i.stroke,course:'SCY'};})(),time:t});
  st.standards=[cut('Demo B','F','100 Free SCY',72.5),cut('Demo A','F','100 Free SCY',66.9),cut('Demo B','M','100 Free SCY',70.9),cut('Demo A','M','100 Free SCY',64.8),cut('Demo B','F','50 Back SCY',38.9),cut('Demo A','M','50 Back SCY',34.1),cut('Demo B','M','50 Back SCY',37.6),cut('Demo B','F','200 IM SCY',175.2),cut('Demo B','M','200 IM SCY',170.4),cut('Demo B','F','100 Breast SCY',92.1),cut('Demo B','M','100 Breast SCY',90.3)];
  return st;
}

/* ---------- boot ---------- */
if(!loadLocal()){ S=SPACE.id==='white'?demoState():blank(); writeLocal(); }
restoreDraft(false);
cleanupSub30(); cleanupOver330(); if(!supaCfg()) cleanupBFree(); render();
if(UI.kiosk){ keepAwake(true); document.addEventListener('pointerdown',function fsOnce(){ document.removeEventListener('pointerdown',fsOnce); try{ if(UI.kiosk&&document.fullscreenEnabled&&!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} }); }
else reopenSheet();
initSync().then(()=>{ if(UI.kiosk) render(); else if(!UI.sheet) reopenSheet(); });
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(reg=>{
    // check for a new version every few minutes, so a board left open all day still gets updates
    setInterval(()=>reg.update().catch(()=>{}),3*60*1000);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{}); });
  // a new version took over: the board reloads right away (its data is synced); the phone waits until nothing is being timed
  const hadCtl=!!navigator.serviceWorker.controller; let pendingReload=false;
  const timing=()=>Object.values(S.meets||{}).some(m=>Object.values(m.timers||{}).some(T=>T&&T.t0&&!T.done));
  const tryReload=back=>{ if(!pendingReload) return;
    if(UI.tab==='display'||UI.kiosk){ if(!document.fullscreenElement) appReload(); else if(!UI.updReady){ UI.updReady=true; render(); } }   // a reload would drop full screen: show a tap-to-update button instead
    else if(back&&!timing()) appReload(); };   // phone: only when coming back to the app, never mid-heat
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!hadCtl) return; pendingReload=true; tryReload(false); });
  setInterval(()=>tryReload(false),15000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tryReload(true); });
}
function appReload(){ try{ sessionStorage.setItem('deckside.tab',UI.tab); }catch(e){} location.reload(); }
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
window.addEventListener('online',()=>{ if(!sync.db&&supaCfg()) initSync(); });
setInterval(()=>{ if(!UI.sheet&&UI.tab==='meet'&&document.visibilityState==='visible'&&!document.activeElement.closest?.('input,textarea,select')) render(); },30000);
</script>
